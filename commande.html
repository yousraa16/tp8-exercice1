<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>commane</title>
    <script src="commande.js"></script>
</head>
<body>
    <h1>Formulaire de Commande</h1>
    <!-- Extrait HTML du formulaire à compléter-->
    <form id="formCommande" onsubmit="return VerifierCommande()">
        <label for="adresse">Adresse de livraison :</label>
        <input type="text" id="adresse" name="adresse"><br><br>
        <label for="entree">Choisissez une entrée :</label>
        <select id="entree" onchange="gererSelection('entree', 'nbEntree');ajoutpanier()">
            <option value="0">Aucun</option>
            <option value="8.5">Salade César (8.5 DT)</option>
            <option value="4.0"> Brik à l'œuf (4.0 DT)</option>
        </select><br><br>
        <label for="nbEntree">Nombre de personnes :</label>
        <input type="number" id="nbEntree" value="0" min="0" oninput="calculerPrix()"><br><br>
        <label for="plat">Choisissez un plat</label>
        <select id="plat">
            <option value="0">aucun</option>
            <option value="6.5">couscous agneau</option>
            <option value="14.5">escalope grillé</option>
        </select><br><br>
        <label for="">Nombre de personnes:</label>
        <input type="number" id="nbPlat" value="0" min="0" oninput="calculerPrix()"><br><br>
        <label for="desert">Choisissez un dessert</label>
        <select id="dessert">
            <option value="0">aucun</option>
            <option value="6.5">tiramisu</option>
            <option value="5.0">salade de fruit</option>
        </select><br><br>
        <label for="nbr">Nombre de personnes:</label>
        <input type="number" id="nbDessert" value="0" min="0" oninput="calculerPrix()"><br><br>
        <label for="total">Tarif total :</label>
        <input type="text" id="total" value="0.00" disabled><br><br>
        <button type="submit">Envoyer</button>
        <div class="cart-section">
        <h3>Mon panier</h3>
        <ul id="liste panier"></ul>
        <div class="cart-totals">
            <p>frais de livraison
                <span id="affichage-livraison">0.00dt</span></p></div>
    </div>
    </form>
</body>
</html>
